[package]
name = "fifine-lite"
version = "0.3.1"
edition = "2024"
description = "Lightweight control app for fifine USB microphones"
license = "GPL-3.0-only"
repository = "https://github.com/Holorigg/fifine-lite"
publish = false

[dependencies]
cpal = "0.18.2"
hidapi = "2.6"
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg", "raw-window-handle-06"] }
tray-icon = { version = "0.26.1", default-features = false }
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Globalization"] }
